<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171D2E">
  <meta name="color-scheme" content="light">
  <title>상용한자 2136</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="홈으로">
        <span class="brand-mark">漢</span>
        <span><strong>상용한자</strong><small>2,136</small></span>
      </button>
      <button id="streakButton" class="streak-pill" type="button" data-nav="stats" aria-label="연속 학습 기록">
        <span>🔥</span><strong id="streakCount">0</strong><small>일</small>
      </button>
    </header>

    <main id="app" class="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button type="button" data-nav="home" class="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5zM9 21v-6h6v6"/></svg>
        <span>홈</span>
      </button>
      <button type="button" data-nav="learn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zm16 0A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>
        <span>학습</span>
      </button>
      <button type="button" data-nav="quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm-2.2-11a2.4 2.4 0 1 1 3.7 2c-.9.6-1.5 1-1.5 2M12 17h.01"/></svg>
        <span>시험</span>
      </button>
      <button type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V11h4v10zm5 0V3h4v18zm5 0v-6h4v6z"/></svg>
        <span>통계</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./data/kanji-data.js"></script>
  <script src="./data/kanji-examples.js"></script>
  <script src="./main.js"></script>
</body>
</html>
